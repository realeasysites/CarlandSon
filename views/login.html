<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Login | Carl's &amp; Son Flooring</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f2320; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; }
    .box { background: #f7f3e8; width: min(380px, 100%); padding: 36px 30px; border-radius: 18px; text-align: center; border-top: 5px solid #c9b97a; }
    img { width: 96px; margin: 0 auto 12px; display: block; }
    h1 { font-size: 1.25rem; margin: 0 0 20px; color: #1f2320; }
    input { width: 100%; box-sizing: border-box; padding: 13px 14px; border: 1px solid #d6cfba; border-radius: 10px; font-size: 1rem; }
    button { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 999px; background: #1f2320; color: #f7f3e8; font-weight: 700; font-size: 1rem; cursor: pointer; }
    p { color: #a33b2b; min-height: 1.3em; margin: 14px 0 0; font-weight: 600; }
  </style>
</head>
<body>
  <form class="box" id="login">
    <img src="/images/logo.jpg" alt="Carl and Son logo">
    <h1>Lead Dashboard</h1>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
    <button type="submit">Sign In</button>
    <p id="err" role="alert"></p>
  </form>
  <script src="/admin/login.js"></script>
</body>
</html>
